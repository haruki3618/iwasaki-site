# 管理画面の設定ファイル（ふだんは触りません）
# ★ 公開時に「YOUR_GITHUB_USER/YOUR_REPO」と「YOUR-SITE.pages.dev」を自分のものに書き換えます（README参照）
backend:
  name: github
  repo: haruki3618/iwasaki-site
  branch: main
  base_url: https://iwasaki-site.ttc2450st0003.workers.dev
  auth_endpoint: api/auth
publish_mode: simple
locale: ja
media_folder: "src/images"
public_folder: "/images"
site_url: https://iwasaki-site.ttc2450st0003.workers.dev
display_url: https://iwasaki-site.ttc2450st0003.workers.dev
collections:
  - name: pages
    label: "サイトの内容を編集"
    label_singular: "ページ"
    description: "編集したいページを選んでください。変更後、右上の「公開する」を押すと数分でサイトに反映されます。"
    editor:
      preview: false
    files:
      - label: "🏢 会社の基本情報（全ページ共通）"
        name: "site"
        file: "src/_data/cms/site.json"
        format: "json"
        fields:
          - label: "会社名・屋号"
            name: "name"
            widget: "string"
          - label: "ロゴ横の一行説明"
            name: "tagline"
            widget: "string"
          - label: "フッターのキャッチコピー"
            name: "slogan"
            widget: "string"
          - label: "郵便番号"
            name: "zip"
            widget: "string"
            hint: "例：935-0025"
          - label: "住所"
            name: "address"
            widget: "string"
          - label: "電話①の名前"
            name: "tel1_label"
            widget: "string"
          - label: "電話①の番号"
            name: "tel1"
            widget: "string"
            hint: "ハイフン付きで。例：0766-74-2679"
          - label: "FAX①"
            name: "fax1"
            widget: "string"
          - label: "電話②の名前"
            name: "tel2_label"
            widget: "string"
          - label: "電話②の番号"
            name: "tel2"
            widget: "string"
          - label: "FAX②"
            name: "fax2"
            widget: "string"
          - label: "InstagramのURL"
            name: "instagram"
            widget: "string"
          - label: "イノスの家 公式サイトのURL"
            name: "inos_url"
            widget: "string"
          - label: "お問い合わせフォームの送信先"
            name: "form_action"
            widget: "string"
            hint: "※変更するとフォームが届かなくなります。通常は触らないでください"
          - label: "検索エンジン向けの短い会社説明"
            name: "short_description"
            widget: "string"
          - label: "ロゴ画像"
            name: "logo"
            widget: "image"
          - label: "ロゴの説明"
            name: "logo_alt"
            widget: "string"
      - label: "🏠 トップページ"
        name: "home"
        file: "src/_data/cms/home.json"
        format: "json"
        fields:
          - label: "ブラウザのタブ・検索結果のタイトル"
            name: "seo_title"
            widget: "string"
            hint: "「 | イワサキ住建 / ハウジングひみ」は自動で付きます"
          - label: "検索結果に出る説明文"
            name: "seo_description"
            widget: "text"
            hint: "100文字前後が目安"
          - label: "最初の大きな背景写真"
            name: "hero_image"
            widget: "image"
            hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）"
          - label: "小さなタグ"
            name: "hero_tag"
            widget: "string"
          - label: "キャッチコピー（前半）"
            name: "hero_title_a"
            widget: "string"
          - label: "キャッチコピー（強調する部分）"
            name: "hero_title_em"
            widget: "string"
          - label: "キャッチコピー（後半）"
            name: "hero_title_b"
            widget: "string"
          - label: "キャッチコピー下の説明文"
            name: "hero_sub"
            widget: "text"
          - label: "数字で見る"
            name: "ribbon"
            widget: "list"
            fields:
              - label: "数字・文字"
                name: "num"
                widget: "string"
              - label: "ラベル"
                name: "label"
                widget: "string"
            summary: "{{fields.num}}　{{fields.label}}"
          - label: "「私たちについて」小見出し"
            name: "about_label"
            widget: "string"
          - label: "見出し"
            name: "about_title"
            widget: "text"
            hint: "Enterキーで改行できます（表示もその位置で改行されます）。"
          - label: "本文"
            name: "about_text"
            widget: "text"
          - label: "リンク文言"
            name: "about_link"
            widget: "string"
          - label: "「私たちについて」の写真"
            name: "about_image"
            widget: "image"
