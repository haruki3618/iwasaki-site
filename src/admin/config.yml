          - label: "「私たちについて」の写真の説明"
            name: "about_alt"
            widget: "string"
            hint: "目の不自由な方向けの読み上げ・検索用。何の写真か一言で（例：白い外壁の新築住宅の外観）"
          - label: "写真の上の小さな文字"
            name: "about_chip_small"
            widget: "string"
          - label: "写真の上の文字"
            name: "about_chip"
            widget: "string"
          - label: "事業内容：小見出し"
            name: "services_label"
            widget: "string"
          - label: "事業内容：見出し"
            name: "services_title"
            widget: "string"
          - label: "事業内容：説明"
            name: "services_lead"
            widget: "text"
          - label: "事業内容カード（4枚。順番・枚数は変えないでください）"
            name: "cards"
            widget: "list"
            fields:
              - label: "写真"
                name: "image"
                widget: "image"
                hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）"
              - label: "写真の説明"
                name: "alt"
                widget: "string"
              - label: "タイトル"
                name: "title"
                widget: "string"
              - label: "説明文"
                name: "text"
                widget: "text"
              - label: "リンク文言"
                name: "go"
                widget: "string"
            min: 4
            max: 4
            add_to_top: false
            summary: "{{fields.title}}"
          - label: "「イノスの家」の写真"
            name: "inos_image"
            widget: "image"
            hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）"
          - label: "「イノスの家」の写真の説明"
            name: "inos_alt"
            widget: "string"
            hint: "目の不自由な方向けの読み上げ・検索用。何の写真か一言で（例：白い外壁の新築住宅の外観）"
          - label: "小見出し"
            name: "inos_label"
            widget: "string"
          - label: "見出し"
            name: "inos_title"
            widget: "string"
          - label: "説明文"
            name: "inos_text"
            widget: "text"
          - label: "ボタンの文言"
            name: "inos_button"
            widget: "string"
          - label: "お問い合わせ：小見出し"
            name: "contact_label"
