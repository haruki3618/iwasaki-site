# 管理画面の設定ファイル（ふだんは触りません）
# ・「name:」の値は変えないでください（サイトのテンプレートがこの名前で内容を探しています）
# ・表示する文言（label / hint / description）は自由に直せます
backend:
  name: github
  repo: haruki3618/iwasaki-site
  branch: main
  base_url: https://iwasaki-site.ttc2450st0003.workers.dev
  auth_endpoint: api/auth
  # 履歴に残る保存メッセージを日本語にする
  commit_messages:
    create: "管理画面から追加：{{collection}} {{slug}}"
    update: "管理画面から更新：{{collection}} {{slug}}"
    delete: "管理画面から削除：{{collection}} {{slug}}"
    uploadMedia: "管理画面から写真を追加：{{path}}"
    deleteMedia: "管理画面から写真を削除：{{path}}"
    openAuthoring: "{{message}}"

# 公開の流れ：「保存」を押すと、そのまま公開されます（数分でサイトに反映）
# （少人数・ひとりでの運用向けのシンプルな設定です。下書きや承認の手順はありません）
publish_mode: simple

locale: ja
logo_url: https://iwasaki-site.ttc2450st0003.workers.dev/images/icon.avif
media_folder: "src/images"
public_folder: "/images"
site_url: https://iwasaki-site.ttc2450st0003.workers.dev
display_url: https://iwasaki-site.ttc2450st0003.workers.dev
collections:
  - name: pages
    label: "サイトの内容を編集"
    label_singular: "ページ"
    description: "編集を始める前に、ブラウザを再読み込みしてください（ほかの人の最新の変更を取り込むためです）。【トップページの並び】① 最初の画面 → ② 私たちについて → ③ 事業内容とイノスの家 → ④ 施工事例・ご相談の流れ・お客様の声 → ⑤ お問い合わせ。各項目の下の「▶ ①〜⑤」が、その場所の目安です。右側にプレビューが出ます（トップページ）。直したら画面上部の「公開」→「公開する」を押すと公開され、3〜5分でサイトに反映されます。右上の「サイトを見る」で、いつでも公開中のサイトを開けます。"
    # 右側にプレビューを表示します（トップページ。ほかのページには「プレビューなし」の案内が出ます）
    editor:
      preview: true
    files:
      - label: "🏢 会社の基本情報（全ページ共通）"
        name: "site"
        file: "src/_data/cms/site.json"
        format: "json"
        fields:
          - label: "会社名・屋号"
            name: "name"
            widget: "string"
            hint: "▶ 反映先：全ページ上部のロゴ横・フッター、会社概要の「屋号」、各ページのタブ名の末尾"
          - label: "ロゴ横の一行説明"
            name: "tagline"
            widget: "string"
            hint: "▶ 反映先：全ページ上部、ロゴ横の屋号の下の一行"
          - label: "フッターのキャッチコピー"
            name: "slogan"
            widget: "string"
            hint: "▶ 反映先：全ページ一番下のフッター（住所・電話の下）"
          - label: "郵便番号"
            name: "zip"
            widget: "string"
            pattern: ['^\s*[0-9０-９]{3}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{4}\s*$', "郵便番号は 935-0025 のように、ハイフン付きの数字で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
            hint: "例：935-0025（全角で入れても保存すると自動で半角に直ります）　▶ 反映先：トップページ下部の連絡先、会社概要ページの「所在地」とアクセス"
          - label: "住所"
            name: "address"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の連絡先、会社概要ページの「所在地」とアクセス、フッター、地図の位置"
          - label: "電話①の名前"
            name: "tel1_label"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の1枚目の電話カードの見出し、会社概要ページの「連絡先（○○）」"
          - label: "電話①の番号"
            name: "tel1"
            widget: "string"
            pattern: ['^\s*[0０][0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{4}\s*$', "番号は 0766-74-2679 のように、ハイフン付きの数字で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
            hint: "ハイフン付きで。例：0766-74-2679（全角で入れても保存すると自動で半角に直ります）　▶ 反映先：全ページ上部の「電話で相談」、フッター、スマホ下部の電話ボタン、各ページ下部の相談バナー、トップページ下部・会社概要ページの連絡先（電話リンクにもなります）"
          - label: "FAX①"
            name: "fax1"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の1枚目の電話カード、会社概要ページの連絡先"
            pattern: ['^\s*[0０][0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{4}\s*$', "番号は 0766-74-2679 のように、ハイフン付きの数字で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
          - label: "電話②の名前"
            name: "tel2_label"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の2枚目の電話カードの見出し、会社概要ページの2つ目の「連絡先（○○）」"
          - label: "電話②の番号"
            name: "tel2"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の2枚目の電話カード、会社概要ページの2つ目の連絡先（電話リンクにもなります）"
            pattern: ['^\s*[0０][0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{4}\s*$', "番号は 0766-74-2679 のように、ハイフン付きの数字で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
          - label: "FAX②"
            name: "fax2"
            widget: "string"
            hint: "▶ 反映先：トップページ下部の2枚目の電話カード、会社概要ページの2つ目の連絡先"
            pattern: ['^\s*[0０][0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{1,4}\s*[-‐‑‒–—―−－ーｰ]\s*[0-9０-９]{4}\s*$', "番号は 0766-74-2679 のように、ハイフン付きの数字で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
          - label: "InstagramのURL"
            name: "instagram"
            widget: "string"
            hint: "▶ 反映先：全ページ上部メニューとフッターの「Instagram」のリンク先"
            pattern: ['^\s*(https|ｈｔｔｐｓ)[:：][/／]{2}', "https:// から始まるアドレスを入力してください"]
          - label: "イノスの家 公式サイトのURL"
            name: "inos_url"
            widget: "string"
            hint: "▶ 反映先：全ページ上部メニューとフッター、トップ・新築ページの「イノスの家」ボタンのリンク先"
            pattern: ['^\s*(https|ｈｔｔｐｓ)[:：][/／]{2}', "https:// から始まるアドレスを入力してください"]
          # 触るとお問い合わせフォームが届かなくなるため、管理画面には表示しません（値はそのまま保たれます）
          - label: "お問い合わせフォームの送信先"
            name: "form_action"
            widget: "hidden"
          # 検索エンジン・SNS共有用の公開アドレス（canonical / og:image / sitemap.xml に使う）。独自ドメインにしたら src/_data/cms/site.json を直接直します
          - label: "サイトの公開アドレス"
            name: "site_url"
            widget: "hidden"
          - label: "検索エンジン向けの短い会社説明"
            name: "short_description"
            widget: "string"
            hint: "▶ 反映先：トップページの検索結果の説明（ページ本体には表示されません）"
          - label: "正式な会社名（地図・検索エンジン・プライバシーポリシー用）"
            name: "legal_name"
            widget: "string"
            hint: "例：有限会社イワサキ住建　▶ 反映先：Googleマップの検索語、検索エンジン向けの情報、プライバシーポリシーの会社名（空欄の場合は「会社名・屋号」を使います）"
          - label: "創業年（西暦）"
            name: "founding_year"
            widget: "string"
            pattern: ['^\s*[0-9]{4}\s*$', "西暦4けたの半角数字で入力してください（例：1991）"]
            hint: "▶ 反映先：検索エンジン向けの情報（ページ本体には表示されません）"
          - label: "対応エリア"
            name: "area_served"
            widget: "string"
            hint: "例：富山県氷見市　▶ 反映先：検索エンジン向けの情報（ページ本体には表示されません）"
          - label: "営業時間（開始）"
            name: "hours_open"
            widget: "string"
            required: false
            pattern: ['^\s*$|^\s*[0-9０-９]{1,2}\s*[:：]\s*[0-9０-９]{2}\s*$', "時刻は 8:30 のように、時:分で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
            hint: "例：8:30　開始と終了の両方を入れると表示されます。空欄なら営業時間は出ません　▶ 反映先：フッター、トップページ下部の連絡先とフォームの注記、会社概要の「営業時間」、検索エンジン向けの情報"
          - label: "営業時間（終了）"
            name: "hours_close"
            widget: "string"
            required: false
            pattern: ['^\s*$|^\s*[0-9０-９]{1,2}\s*[:：]\s*[0-9０-９]{2}\s*$', "時刻は 8:30 のように、時:分で入力してください（全角で入力しても、保存すると自動で半角に直ります）"]
            hint: "例：17:30　▶ 反映先：「営業時間（開始）」と同じ"
          - label: "定休日（曜日）"
            name: "closed_days"
            widget: "select"
            multiple: true
            required: false
            options:
              - { label: "月曜", value: "Monday" }
              - { label: "火曜", value: "Tuesday" }
              - { label: "水曜", value: "Wednesday" }
              - { label: "木曜", value: "Thursday" }
              - { label: "金曜", value: "Friday" }
              - { label: "土曜", value: "Saturday" }
              - { label: "日曜", value: "Sunday" }
            hint: "休みの曜日を選びます（複数選べます。ない場合は何も選びません）　▶ 反映先：フッター、トップページ下部の連絡先、会社概要の「定休日」、検索エンジン向けの情報（営業日・営業時間）"
          - label: "定休日（祝日・年末年始など）"
            name: "holiday_extra"
            widget: "string"
            required: false
            hint: "例：祝日・年末年始・お盆　曜日の定休日のあとに「・」でつないで表示されます。「不定休」とだけ入れてもかまいません（祝日などは、検索エンジン向けの情報には反映されません）　▶ 反映先：「定休日（曜日）」と同じ"
          - label: "ロゴ画像"
            name: "logo"
            widget: "image"
            hint: "▶ 反映先：全ページ上部とフッターのロゴ、ブラウザのタブのアイコン"
          - label: "ロゴの説明"
            name: "logo_alt"
            widget: "string"
            hint: "▶ 反映先：上部ロゴの説明。画面には表示されません（写真が表示されないとき・読み上げ・検索で使われます）"
      - label: "🏠 トップ① 最初の画面（写真・キャッチコピー・数字）"
        name: "home"
        file: "src/_data/cms/home.json"
        format: "json"
        fields:
          - label: "ブラウザのタブ・検索結果のタイトル"
            name: "seo_title"
            widget: "string"
            hint: "「 | イワサキ住建 / ハウジングひみ」は自動で付きます　▶ ブラウザのタブ・検索結果（ページ本体には出ません）"
            pattern: ["^.{1,40}$", "40文字以内で入力してください（空欄にはできません）"]
          - label: "検索結果に出る説明文"
            name: "seo_description"
            widget: "text"
            hint: "100文字前後が目安　▶ 検索結果の説明文（ページ本体には出ません）"
            pattern: ["^[\\s\\S]{1,200}$", "200文字以内で入力してください（空欄にはできません）"]
          - label: "最初の大きな背景写真"
            name: "hero_image"
            widget: "image"
            hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）　横長・幅1600px以上がきれいです。大事な物は写真の中央に　▶ ① 一番上の大きな背景"
          - label: "小さなタグ"
            name: "hero_tag"
            widget: "string"
            hint: "▶ ① キャッチコピーの上の小さなタグ"
          - label: "キャッチコピー（前半）"
            name: "hero_title_a"
            widget: "string"
            hint: "前半・強調・後半をつなげて14文字前後までがきれいに収まります　▶ ① キャッチコピー"
          - label: "キャッチコピー（強調する部分）"
            name: "hero_title_em"
            widget: "string"
            hint: "緑色で目立つ部分　▶ ① キャッチコピー"
          - label: "キャッチコピー（後半）"
            name: "hero_title_b"
            widget: "string"
            hint: "▶ ① キャッチコピー"
          - label: "キャッチコピー下の説明文"
            name: "hero_sub"
            widget: "text"
            hint: "80文字前後まで　▶ ① キャッチコピーの下"
          - label: "数字の帯"
            name: "ribbon"
            widget: "list"
            hint: "3つがきれいに並びます　▶ ① 写真の下の白い帯"
            summary: "{{fields.num}}　{{fields.label}}"
    
            fields:
              - label: "数字・文字"
                name: "num"
                widget: "string"
                hint: "大きく出る数字や短い言葉"
              - label: "ラベル"
                name: "label"
                widget: "string"
                hint: "数字の下の小さな説明"
      - label: "🏠 トップ② 私たちについて"
        name: "home_about"
        file: "src/_data/cms/home_about.json"
        format: "json"
        fields:
          - label: "小見出し"
            name: "about_label"
            widget: "string"
            hint: "▶ ② 左上の小さな見出し"
          - label: "見出し"
            name: "about_title"
            widget: "text"
            hint: "Enterキーで改行できます　▶ ② 大見出し"
          - label: "本文"
            name: "about_text"
            widget: "text"
            hint: "▶ ② 本文"
          - label: "リンク文言"
            name: "about_link"
            widget: "string"
            hint: "▶ ② 本文の下のリンク（会社概要ページへ）"
          - label: "写真"
            name: "about_image"
            widget: "image"
            hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）　縦長（4:5）に切り取られて表示されます。中央に大事な物を　▶ ② 右側の写真"
          - label: "写真の説明"
            name: "about_alt"
            widget: "string"
            hint: "何の写真か一言で（画面には出ません。読み上げ・検索用）"
          - label: "写真の上の小さな文字"
            name: "about_chip_small"
            widget: "string"
            hint: "▶ ② 写真に重なる緑のラベル（小）"
          - label: "写真の上の文字"
            name: "about_chip"
            widget: "string"
            hint: "▶ ② 写真に重なる緑のラベル（大）"
      - label: "🏠 トップ③ 事業内容とイノスの家"
        name: "home_services"
        file: "src/_data/cms/home_services.json"
        format: "json"
        fields:
          - label: "小見出し"
            name: "services_label"
            widget: "string"
            hint: "▶ ③ 事業内容の小見出し"
          - label: "見出し"
            name: "services_title"
            widget: "string"
            hint: "▶ ③ 事業内容の見出し"
          - label: "説明"
            name: "services_lead"
            widget: "text"
            hint: "▶ ③ 見出し右側の説明"
          - label: "事業内容カード"
            name: "cards"
            widget: "list"
            hint: "4枚固定です。順番を入れ替えても、リンク先は変わりません（1枚目・2枚目は大きく表示されます）　▶ ③ 4枚のカード"
            fields:
              - label: "写真"
                name: "image"
                widget: "image"
                hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）　横長がきれいです"
              - label: "写真の説明"
                name: "alt"
                widget: "string"
                hint: "何の写真か一言で（画面には出ません。読み上げ・検索用）"
              - label: "タイトル"
                name: "title"
                widget: "string"
              - label: "説明文"
                name: "text"
                widget: "text"
                hint: "80文字前後まで"
              - label: "リンク文言"
                name: "go"
                widget: "string"
              - label: "リンク先（変更しないでください）"
                name: "link"
                widget: "hidden"
              - label: "見た目（変更しないでください）"
                name: "variant"
                widget: "hidden"
            min: 4
            max: 4
            add_to_top: false
            summary: "{{fields.title}}"
          - label: "「イノスの家」の写真"
            name: "inos_image"
            widget: "image"
            hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）　横長。帯の左半分に表示されます　▶ ③ イノスの家の帯"
          - label: "写真の説明"
            name: "inos_alt"
            widget: "string"
            hint: "何の写真か一言で（画面には出ません。読み上げ・検索用）"
          - label: "小見出し"
            name: "inos_label"
            widget: "string"
            hint: "▶ ③ イノスの家の帯"
          - label: "見出し"
            name: "inos_title"
            widget: "string"
            hint: "▶ ③ イノスの家の帯"
          - label: "説明文"
            name: "inos_text"
            widget: "text"
            hint: "▶ ③ イノスの家の帯"
          - label: "ボタンの文言"
            name: "inos_button"
            widget: "string"
            hint: "▶ ③ イノスの家の帯のボタン（公式サイトへ）"
      - label: "🏠 トップ④ 施工事例・ご相談の流れ・お客様の声"
        name: "home_works"
        file: "src/_data/cms/home_works.json"
        format: "json"
        fields:
          - label: "施工事例：小見出し"
            name: "works_label"
            widget: "string"
            hint: "▶ ④ 施工事例の小見出し"
          - label: "施工事例：見出し"
            name: "works_title"
            widget: "string"
            hint: "▶ ④ 施工事例の見出し"
          - label: "施工事例：説明"
            name: "works_lead"
            widget: "text"
            hint: "▶ ④ 見出し右側の説明"
          - label: "施工事例の写真"
            name: "works"
            widget: "list"
            hint: "6枚が目安です。0枚にすると、このコーナーはサイトに表示されません　▶ ④ 施工事例のギャラリー"
            fields:
              - label: "写真"
                name: "image"
                widget: "image"
                hint: "写真を選ぶ／アップロード（JPG・PNGでもOK。自動で軽くなります）　横長（4:3）で表示されます"
              - label: "写真の説明"
                name: "alt"
                widget: "string"
                hint: "何の写真か一言で（画面には出ません。読み上げ・検索用）"
              - label: "タイトル"
                name: "title"
                widget: "string"
                hint: "例：白い外壁の家"
              - label: "種類"
                name: "text"
                widget: "string"
                hint: "例：新築・外観"
                required: false
            min: 0
            max: 9
            summary: "{{fields.title}}"
