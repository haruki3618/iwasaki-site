<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>サイト編集 | イワサキ住建 / ハウジングひみ</title>
  <style>
    /* 管理画面の見た目の調整（Decap CMS の公式機能ではないため、控えめな指定だけにしています）
       うまく効かなくなっても、編集そのものには影響しません */
    #nc-root {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }
    #nc-root label { font-weight: 600; }
    #nc-root input[type="text"], #nc-root textarea { font-size: 16px; }
    #nc-root textarea { line-height: 1.7; }
    #nc-root button { cursor: pointer; }
    /* スマホ・小さい画面：Decap CMS の編集画面は幅800pxの最小幅が付いていて、横にはみ出し、
       上部の「公開」ボタンなども画面の外に出てしまう。小さい画面のときだけ、画面の幅に収める。
       （Decap CMS の内部のクラス名の一部に一致させているだけなので、効かなくなっても編集には影響しません） */
    @media (max-width: 820px) {
      [class*="AppMainContainer"], [class*="AppHeaderContent"], [class*="EditorContainer"], [class*="ToolbarContainer"] {
        min-width: 0 !important;
        width: 100% !important;
        max-width: 100vw;
      }
    }
    /* ブランドカラーに合わせた見た目（クラス名の一部に一致させているだけなので、効かなくなっても編集には影響しません） */
    #nc-root { font-size: 16px; }
    [class*="AppHeader"] { border-top: 4px solid #8FC320; }
    [class*="PublishButton"], [class*="PublishDropDown"] button, button[class*="PublishButton"] {
      background-color: #8FC320 !important; color: #1F2A17 !important; font-weight: 700 !important;
      font-size: 15px !important; padding: 0 24px !important; border-radius: 999px !important;
    }
    #ui-toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9999;
      width: min(680px, calc(100vw - 24px)); display: flex; align-items: center; gap: 14px;
      background: #1F2A17; color: #fff; padding: 16px 18px 16px 22px; border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35); font-size: 14px; line-height: 1.7;
    }
    #ui-toast .ui-toast-msg { flex: 1; }
    #ui-toast b { color: #8FC320; margin-right: 6px; }
    #ui-toast a { flex: none; background: #8FC320; color: #1F2A17; font-weight: 700; text-decoration: none; padding: 10px 16px; border-radius: 999px; }
    #ui-toast button { flex: none; border: 0; background: transparent; color: #fff; font-size: 22px; line-height: 1; padding: 6px 8px; cursor: pointer; }
    #nc-root a:focus-visible, #nc-root button:focus-visible, #nc-root input:focus-visible, #nc-root textarea:focus-visible {
      outline: 3px solid #f2a900;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- バージョンを固定しています（3.8.4）。上げるときは、URLの数字を書き換えたあと
       `npm run sri` を実行して integrity（改ざん検知のハッシュ）を更新し、管理画面で動作確認します -->
  <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js" integrity="sha384-JNjmpWfdPuQ3I7ac38W0teoHcVxx7YdfDVpcgehfGqcu6ZBt26m/nmmBM2FzuO41" crossorigin="anonymous"></script>
  <!-- 保存時の入力ミスの自動補正（全角→半角など）。Decap CMS の読み込みより後に置きます -->
  <script src="/admin/normalize.js"></script>
  <!-- プレビュー（トップページ）と、公開後のお知らせ。どちらも Decap CMS の読み込みより後に置きます -->
  <script src="/admin/preview.js"></script>
  <script src="/admin/admin-ui.js"></script>
</body>
</html>
